github_monitor:
  - name: "GitHub Trending 招投标"
    code: "github_tender"
    type: "api"
    url: "https://api.github.com/search/repositories"
    industry: "00"
    weight: 0.5
    # 2026-09-30: 返回全英文仓库内容, 与"真实招标信息"需求不符, 禁用
    enabled: false
    config:
      languages: ["python", "typescript"]
      topics: ["tender", "bidding", "procurement"]
      min_stars: 5
      max_results: 20

