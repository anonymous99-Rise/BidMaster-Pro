# ============================================================
# 数据源定位说明 (2026-10-08):
# 本平台为招投标业务系统, 资讯中心仅收录与招标采购直接相关的
# 真实信息源 (政府采购/公共资源交易/招标服务平台/企业采购)。
# 通用科技/AI 媒体、GitHub 等与招标业务无关的源已移除,
# 勿再添加, 避免无关资讯稀释商机信号。
# ============================================================
