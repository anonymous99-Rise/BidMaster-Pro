# 招投标行业预置数据源
# 配置参考 article-generation-skill 的 sources.yaml
# type: rss / api / crawl
# weight: 综合权重 (0-1),影响评分
# enabled: 是否启用,管理员可在 UI 修改

government_procurement:
  # 2026-09-30 实测: ccgp 无 RSS 且搜索接口 403, 但公告列表页可直接访问(200),
  # 改用 crawl 方案抓列表页+详情; 地方公告覆盖全国各省项目
  - name: "中国政府采购网-中央公告"
    code: "ccgp_central"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/zygg/"
    industry: "04"
    weight: 1.0
    enabled: true
    description: "中央国家机关政府采购公告(全国性项目)"
  - name: "中国政府采购网-地方公告"
    code: "ccgp_local"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/dfgg/"
    industry: "04"
    weight: 1.0
    enabled: true
    description: "地方各级政府采购公告(覆盖全国各省)"
  - name: "中国政府采购网-变更公告"
    code: "ccgp_change"
    type: "crawl"
    url: "http://www.ccgp.gov.cn/cggg/dfgg/gzgg/"
    industry: "04"
    weight: 0.8
    enabled: true
    # 2026-10-09 实测: 原 rss_change.xml 404; 地方更正公告列表页静态可达,
    # 条目为 .htm 详情页, 走通用 crawl 解析
    description: "政府采购更正/变更公告(地方, 覆盖全国各省)"

engineering:
  # 2026-09-30 实测: 新疆/宁夏站点是 Epoint WebBuilder 平台, 栏目页为 JS 壳,
  # 静态 crawl 只能拿到占位符, 改用 epoint 类型直连其 ES 检索接口
  # (getFullTextDataNew), categories 为叶子分类号, 走 unionCondition OR 过滤
  - name: "宁夏回族自治区公共资源交易网-采购公告"
    code: "ggzy_ningxia"
    type: "epoint"
    url: "https://ggzyjy.fzggw.nx.gov.cn/dzjy/001001/001001002/001001002001/trade_infomation.html"
    industry: "01"
    weight: 1.0
    enabled: true
    config:
      api_path: "/interface_wz/rest/esinteligentsearch/getFullTextDataNew"
      categories: ["001001002001", "001001002002", "001001002003"]
    description: "宁夏政府采购项目采购公告(重点区域)"
  - name: "新疆维吾尔自治区公共资源交易网-政府采购"
    code: "ggzy_xinjiang"
    type: "epoint"
    url: "https://ggzy.xinjiang.gov.cn/xinjiangggzy_new/jyxx/001004/trade_info.html"
    industry: "01"
    weight: 1.0
    enabled: true
    config:
      api_path: "/inteligentsearchnew/rest/esinteligentsearch/getFullTextDataNew"
      categories: ["001004003", "001004004", "001004005"]
    description: "新疆政府采购交易公告(重点区域)"
  - name: "全国公共资源交易平台"
    code: "ggzy_national"
    type: "crawl"
    url: "https://www.ggzy.gov.cn/"
    industry: "01"
    weight: 1.0
    enabled: true
    config:
      max_items: 20
      include_pattern: "/information/deal/html/a/"
    # 2026-10-09 实测: 无 RSS; 但首页为 SSR 直出, 公告链接+日期可直接解析
    # (/information/deal/html/a/{省码}/{类码}/{日期}/{id}.html), 详情页亦为静态 html;
    # deal.ggzy.gov.cn 搜索子域外网不可达, 走首页"交易公告"最新列表
    description: "全国公共资源交易公告聚合(招标/中标/更正, 31省)"
  - name: "北京市公共资源交易服务平台"
    code: "ggzy_bj"
    type: "rss"
    url: "https://www.bjggzy.com/rss"
    industry: "01"
    weight: 0.9
    enabled: false
  - name: "上海市公共资源交易中心"
    code: "ggzy_sh"
    type: "rss"
    url: "https://www.sggzy.com/rss"
    industry: "01"
    weight: 0.9
    enabled: false
  - name: "广东省公共资源交易中心"
    code: "ggzy_gd"
    type: "rss"
    url: "https://www.gdggzy.com/rss"
    industry: "01"
    weight: 0.9
    enabled: false
  - name: "江苏省公共资源交易平台"
    code: "ggzy_js"
    type: "rss"
    url: "https://www.jszwfw.gov.cn/rss"
    industry: "01"
    weight: 0.85
    enabled: false
  - name: "浙江省公共资源交易中心"
    code: "ggzy_zj"
    type: "rss"
    url: "https://www.ggzy.zj.gov.cn/rss"
    industry: "01"
    weight: 0.85
    enabled: false
  - name: "山东省公共资源交易中心"
    code: "ggzy_sd"
    type: "rss"
    url: "https://www.sdggzyjy.gov.cn/rss"
    industry: "01"
    weight: 0.8
    enabled: false

tender_service:
  # 2026-10-09 实测: 无 RSS; 全站挂 interfaceacting/antidom 混淆 JS 加密壳,
  # 静态抓取只能拿到壳。公告列表在 bulletin 子站 xxfbcmses/search/*.html,
  # 需无头浏览器执行壳 JS 后从渲染 DOM 提取, 走 browser 类型 (crawl4ai)
  - name: "中国招标投标公共服务平台"
    code: "cebpubservice"
    type: "browser"
    url: "https://bulletin.cebpubservice.com/xxfbcmses/search/bulletin.html?searchDate={today}"
    industry: "01"
    weight: 1.0
    enabled: true
    description: "国家级招标投标公告(招标公告, 当日, 全国各媒介聚合)"
  - name: "比比招标采购网"
    code: "ebidding"
    type: "crawl"
    url: "https://www.ebidding.com/notice"
    industry: "01"
    weight: 0.8
    # 2026-10-09 实测: 国e平台为 Vue SPA 且公告数据在登录墙后的接口层,
    # 无头渲染也无法获取; 数据与 cebpubservice 高度重叠(同为国家平台渠道),
    # 禁用, 由 cebpubservice 覆盖
    enabled: false
    description: "国e平台公告(登录墙, 由 cebpubservice 覆盖)"
  - name: "千里马招标网"
    code: "qianlima"
    type: "crawl"
    url: "https://www.qianlima.com/zb"
    industry: "01"
    weight: 0.7
    # 2026-09-30 实测: 商业站反爬, 详情页 521, 非政府采购信息, 禁用
    enabled: false
  - name: "招标网"
    code: "zhaobiao"
    type: "crawl"
    url: "https://www.zhaobiao.cn"
    industry: "01"
    weight: 0.7
    # 2026-09-30 实测: 列表在反爬子域(zb.* 521), 非政府采购信息, 禁用
    enabled: false

