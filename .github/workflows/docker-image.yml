# ============================================================================
# API 镜像构建发布: GitHub Actions → ghcr.io (GitHub Packages)
# ----------------------------------------------------------------------------
# 产物: ghcr.io/<owner小写>/bidmaster-pro(仓库名自动小写, 由 metadata-action 处理)
#   - push 到 main 且后端相关文件变化 → tag: latest + main
#   - push v* tag                     → tag: latest + 语义版本 (v2.0.6 → 2.0.6)
#   - Actions 页面手动触发 (workflow_dispatch)
#
# 其他服务器部署 (public 包免登录):
#   1. docker/.env 里设 API_IMAGE=ghcr.io/<owner小写>/bidmaster-pro:<tag>
#   2. docker compose up -d api celery-worker celery-beat
#
# 可见性: 镜像含完整后端源码, 用户已拍板 public (2026-10-09)。
# GITHUB_TOKEN 首推的包默认 private, 需一次性转 public:
#   - 包页面 → Package settings → Danger Zone → Change visibility → public; 或
#   - GitHub → Settings → Packages → Package creation → 默认可见性设 public (一劳永逸)
# ============================================================================
name: docker-image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "services/**"
      - "core/**"
      - "pyproject.toml"
      - "uv.lock"
      - "docker/Dockerfile.api"
      - "docker/entrypoint.sh"
      - ".github/workflows/docker-image.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像 tag
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions runner 在海外, 基础镜像直连 Docker Hub (Dockerfile 默认是 DaoCloud 国内代理)
          build-args: |
            REGISTRY=docker.io
          cache-from: type=gha
          cache-to: type=gha,mode=max
