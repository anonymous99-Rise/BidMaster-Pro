name: Desktop Client Release

# 触发方式：
#   1. 推送版本 tag（推荐）：git tag v0.1.0 && git push origin v0.1.0
#      tag 需与 packages/desktop/package.json 的 version 一致（如 v0.1.0 ↔ 0.1.0）
#   2. 手动触发（Actions 页面 Run workflow）
# 产物：Windows 安装包 / macOS DMG / Linux AppImage，自动发布到 GitHub Releases
# 注意：日常构建请用 desktop-client-ci.yml（只出构件，不发布）

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        working-directory: packages/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/desktop/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Build and publish desktop client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build -- --publish=always

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-client-release-${{ matrix.os }}
          path: |
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.zip
            packages/desktop/dist/latest*.yml
          if-no-files-found: warn
